<!DOCTYPE html>
<html lang="sw">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smile TV</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#000;
color:#fff;
min-height:100vh;
}

button{
cursor:pointer;
border:none;
}

#loginBox{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
padding:20px;
background:linear-gradient(135deg,#111,#222);
}

.logo{
font-size:42px;
font-weight:bold;
color:#ff0050;
margin-bottom:10px;
}

.subtitle{
color:#ccc;
margin-bottom:25px;
text-align:center;
}

#loginButton{
background:#fff;
color:#111;
padding:14px 25px;
border-radius:30px;
font-size:16px;
font-weight:bold;
}

#loginMessage{
margin-top:15px;
color:#ffcc00;
text-align:center;
max-width:350px;
}

#app{
display:none;
}

header{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
z-index:1000;
border-bottom:1px solid #333;
}

.headerLogo{
font-size:24px;
font-weight:bold;
color:#ff0050;
}

.headerButtons{
display:flex;
gap:8px;
}

.headerButtons button{
background:#222;
color:#fff;
padding:8px 12px;
border-radius:20px;
font-size:13px;
}

#loading{
display:none;
height:100vh;
align-items:center;
justify-content:center;
font-size:18px;
}

#feed{
padding-top:60px;
padding-bottom:80px;
}

.videoCard{
width:100%;
min-height:calc(100vh - 60px);
position:relative;
background:#000;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border-bottom:1px solid #222;
}

.videoCard video{
width:100%;
height:calc(100vh - 60px);
object-fit:cover;
background:#000;
}

.videoInfo{
position:absolute;
left:15px;
bottom:25px;
right:80px;
z-index:10;
text-shadow:0 1px 4px #000;
}

.username{
font-size:17px;
font-weight:bold;
margin-bottom:8px;
}

.caption{
font-size:15px;
line-height:1.4;
}

.actions{
position:absolute;
right:12px;
bottom:35px;
display:flex;
flex-direction:column;
gap:14px;
z-index:20;
}

.actionBtn{
width:50px;
height:50px;
border-radius:50%;
background:rgba(30,30,30,.8);
color:#fff;
font-size:22px;
display:flex;
align-items:center;
justify-content:center;
}

.actionText{
font-size:11px;
text-align:center;
margin-top:-9px;
}

.uploadBox{
display:none;
position:fixed;
top:60px;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.96);
z-index:2000;
padding:20px;
overflow-y:auto;
}

.uploadBox h2{
margin-bottom:20px;
}

.uploadBox input,
.uploadBox textarea{
width:100%;
padding:13px;
margin-bottom:15px;
border-radius:8px;
border:1px solid #444;
background:#151515;
color:#fff;
}

.uploadButton{
background:#ff0050;
color:#fff;
padding:14px;
width:100%;
border-radius:8px;
font-weight:bold;
}

.closeButton{
background:#333;
color:#fff;
padding:10px 18px;
border-radius:20px;
margin-bottom:20px;
}

.progress{
margin-top:15px;
color:#00ff88;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
z-index:3000;
overflow-y:auto;
padding:20px;
}

.modalContent{
max-width:600px;
margin:40px auto;
background:#151515;
border-radius:15px;
padding:20px;
}

.modalHeader{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.closeModal{
background:#333;
color:#fff;
width:35px;
height:35px;
border-radius:50%;
font-size:18px;
}

.profileTop{
text-align:center;
}

.profilePhoto{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
background:#333;
margin-bottom:10px;
}

.profileName{
font-size:20px;
font-weight:bold;
}

.profileStats{
display:flex;
justify-content:center;
gap:30px;
margin:20px 0;
}

.stat{
text-align:center;
}

.stat strong{
display:block;
font-size:20px;
}

.stat span{
font-size:12px;
color:#aaa;
}

.followButton{
background:#ff0050;
color:#fff;
padding:11px 30px;
border-radius:25px;
font-weight:bold;
}

.followingButton{
background:#333;
}

.profileVideos{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:3px;
margin-top:20px;
}

.profileVideos video{
width:100%;
height:180px;
object-fit:cover;
background:#000;
}

.comment{
padding:12px 0;
border-bottom:1px solid #333;
}

.commentUser{
font-weight:bold;
margin-bottom:4px;
}

.commentText{
color:#ddd;
}

.commentForm{
display:flex;
gap:8px;
margin-top:15px;
}

.commentForm input{
flex:1;
padding:12px;
border-radius:20px;
border:1px solid #444;
background:#222;
color:#fff;
}

.commentForm button{
background:#ff0050;
color:#fff;
padding:0 18px;
border-radius:20px;
}

.empty{
text-align:center;
padding:50px 20px;
color:#aaa;
}

</style>

</head>

<body>


<!-- LOGIN -->

<div id="loginBox">

<div class="logo">SMILE TV</div>

<div class="subtitle">
Tazama, pakia na shiriki video zako.
</div>

<button id="loginButton">
🔐 Ingia kwa Google
</button>

<div id="loginMessage"></div>

</div>


<!-- APP -->

<div id="app">

<header>

<div class="headerLogo">
Smile TV
</div>

<div class="headerButtons">

<button onclick="openUpload()">
➕ Upload
</button>

<button onclick="openMyProfile()">
👤 Profile
</button>

</div>

</header>


<div id="loading">
Inapakia video...
</div>


<div id="feed"></div>

</div>


<!-- UPLOAD -->

<div id="uploadBox" class="uploadBox">

<button class="closeButton" onclick="closeUpload()">
← Rudi
</button>

<h2>📤 Pakia Video</h2>

<input
type="file"
id="videoFile"
accept="video/*"
>

<textarea
id="videoCaption"
placeholder="Andika maelezo ya video yako..."
rows="4"
></textarea>

<button
class="uploadButton"
onclick="uploadVideo()"
>
📤 PAKIA VIDEO
</button>

<div id="uploadProgress" class="progress"></div>

</div>


<!-- COMMENTS MODAL -->

<div id="commentsModal" class="modal">

<div class="modalContent">

<div class="modalHeader">

<h2>💬 Comments</h2>

<button
class="closeModal"
onclick="closeComments()"
>
×
</button>

</div>

<div id="commentsList"></div>

<div class="commentForm">

<input
id="commentInput"
placeholder="Andika comment..."
>

<button onclick="sendComment()">
Tuma
</button>

</div>

</div>

</div>


<!-- PROFILE MODAL -->

<div id="profileModal" class="modal">

<div class="modalContent">

<div class="modalHeader">

<h2>👤 Profile</h2>

<button
class="closeModal"
onclick="closeProfile()"
>
×
</button>

</div>

<div class="profileTop">

<img
id="profilePhoto"
class="profilePhoto"
src=""
>

<div
id="profileName"
class="profileName"
>
User
</div>

<div class="profileStats">

<div class="stat">
<strong id="followersCount">0</strong>
<span>Followers</span>
</div>

<div class="stat">
<strong id="followingCount">0</strong>
<span>Following</span>
</div>

<div class="stat">
<strong id="profileVideoCount">0</strong>
<span>Videos</span>
</div>

</div>

<button
id="followButton"
class="followButton"
onclick="toggleFollow()"
>
Follow
</button>

</div>

<div
id="profileVideos"
class="profileVideos"
></div>

</div>

</div>



<!-- FIREBASE -->

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy,
updateDoc,
doc,
increment,
setDoc,
deleteDoc,
getDoc,
where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:
"AIzaSyCu5afNJaHts8CSUGnwJg-TgRZzHBMH0eU",

authDomain:
"smile-tv-1d3a1.firebaseapp.com",

projectId:
"smile-tv-1d3a1",

storageBucket:
"smile-tv-1d3a1.firebasestorage.app",

messagingSenderId:
"873816908067",

appId:
"1:873816908067:web:01a899081383a74e55ec96"

};



const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const provider =
new GoogleAuthProvider();


let currentUser = null;

let currentCommentVideo = null;

let viewedProfileEmail = null;



/* LOGIN */

document
.getElementById("loginButton")
.onclick = async function(){

const message =
document.getElementById("loginMessage");

message.textContent =
"Inaingia...";

try{

await signInWithPopup(
auth,
provider
);

}catch(error){

console.error(error);

message.textContent =
"❌ Imeshindikana kuingia: " +
error.message;

}

};



/* AUTH STATE */

onAuthStateChanged(
auth,
async function(user){

if(user){

currentUser = user;

document
.getElementById("loginBox")
.style.display = "none";

document
.getElementById("app")
.style.display = "block";

document
.getElementById("loading")
.style.display = "flex";

await loadVideos();

document
.getElementById("loading")
.style.display = "none";

}else{

currentUser = null;

document
.getElementById("loginBox")
.style.display = "flex";

document
.getElementById("app")
.style.display = "none";

}

}
);



/* LOAD VIDEOS */

async function loadVideos(){

const feed =
document.getElementById("feed");

feed.innerHTML = "";

try{

const videosQuery =
query(
collection(db,"videos"),
orderBy("createdAt","desc")
);

const snapshot =
await getDocs(videosQuery);

if(snapshot.empty){

feed.innerHTML =
'<div class="empty">Hakuna video bado.</div>';

return;

}

snapshot.forEach(
function(videoDoc){

createVideoCard(
videoDoc.id,
videoDoc.data()
);

});

}catch(error){

console.error(error);

feed.innerHTML =
'<div class="empty">❌ Imeshindikana kupakia video.</div>';

}

}



/* CREATE VIDEO CARD */

function createVideoCard(id,data){

const card =
document.createElement("div");

card.className =
"videoCard";

const video =
document.createElement("video");

video.src =
data.videoUrl;

video.controls = true;

video.loop = true;

video.playsInline = true;

video.preload = "metadata";



const info =
document.createElement("div");

info.className =
"videoInfo";


const username =
document.createElement("div");

username.className =
"username";

username.textContent =
"@" + (data.user || "user");

username.style.cursor =
"pointer";

username.onclick =
function(){

openUserProfile(
data.user,
data.photoURL || ""
);

};



const caption =
document.createElement("div");

caption.className =
"caption";

caption.textContent =
data.caption || "";



info.appendChild(username);

info.appendChild(caption);



/* ACTIONS */

const actions =
document.createElement("div");

actions.className =
"actions";



/* LIKE */

const likeButton =
document.createElement("button");

likeButton.className =
"actionBtn";

likeButton.innerHTML =
"❤️";



const likeText =
document.createElement("div");

likeText.className =
"actionText";

likeText.textContent =
(data.likes || 0) + " Likes";



likeButton.onclick =
async function(){

try{

await updateDoc(
doc(db,"videos",id),
{
likes:increment(1)
}
);

const current =
parseInt(
likeText.textContent
) || 0;

likeText.textContent =
(current + 1) + " Likes";

}catch(error){

console.error(error);

}

};



actions.appendChild(likeButton);

actions.appendChild(likeText);



/* COMMENTS */

const commentButton =
document.createElement("button");

commentButton.className =
"actionBtn";

commentButton.innerHTML =
"💬";

const commentText =
document.createElement("div");

commentText.className =
"actionText";

commentText.textContent =
"Comments";

commentButton.onclick =
function(){

openComments(id);

};



actions.appendChild(commentButton);

actions.appendChild(commentText);



/* PROFILE */

const profileButton =
document.createElement("button");

profileButton.className =
"actionBtn";

profileButton.innerHTML =
"👤";

profileButton.onclick =
function(){

openUserProfile(
data.user,
data.photoURL || ""
);

};

actions.appendChild(profileButton);



card.appendChild(video);

card.appendChild(info);

card.appendChild(actions);

document
.getElementById("feed")
.appendChild(card);

}



/* UPLOAD WINDOW */

window.openUpload =
function(){

document
.getElementById("uploadBox")
.style.display =
"block";

};



window.closeUpload =
function(){

document
.getElementById("uploadBox")
.style.display =
"none";

};



/* CLOUDINARY UPLOAD */

window.uploadVideo =
async function(){

if(!currentUser){

alert("Tafadhali ingia kwanza.");

return;

}


const file =
document
.getElementById("videoFile")
.files[0];

const caption =
document
.getElementById("videoCaption")
.value.trim();


if(!file){

alert("Chagua video kwanza.");

return;

}


if(!file.type.startsWith("video/")){

alert("Tafadhali chagua video.");

return;

}


const progress =
document
.getElementById("uploadProgress");

progress.textContent =
"Inapakia video... tafadhali subiri.";


try{


const formData =
new FormData();

formData.append(
"file",
file
);

formData.append(
"upload_preset",
"smile_tv"
);



const response =
await fetch(
"https://api.cloudinary.com/v1_1/hvzksa0n/video/upload",
{
method:"POST",
body:formData
}
);


const result =
await response.json();


if(!response.ok){

throw new Error(
result.error?.message ||
"Cloudinary upload failed"
);

}


progress.textContent =
"Inahifadhi video...";


await addDoc(
collection(db,"videos"),
{

videoUrl:
result.secure_url,

caption:
caption,

user:
currentUser.email,

userName:
currentUser.displayName || "",

photoURL:
currentUser.photoURL || "",

likes:
0,

createdAt:
Date.now()

}
);


progress.textContent =
"✅ Video imepakiwa vizuri!";


document
.getElementById("videoFile")
.value = "";

document
.getElementById("videoCaption")
.value = "";


setTimeout(
async function(){

closeUpload();

progress.textContent = "";

await loadVideos();

},
1000
);


}catch(error){

console.error(error);

progress.textContent =
"❌ Imeshindikana: " +
error.message;

}

};



/* COMMENTS */

window.openComments =
async function(videoId){

currentCommentVideo =
videoId;

document
.getElementById("commentsModal")
.style.display =
"block";

await loadComments(videoId);

};



window.closeComments =
function(){

document
.getElementById("commentsModal")
.style.display =
"none";

};



async function loadComments(videoId){

const list =
document
.getElementById("commentsList");

list.innerHTML =
"Inapakia comments...";


try{

const q =
query(
collection(db,"comments"),
where(
"videoId",
"==",
videoId
)
);

const snapshot =
await getDocs(q);

list.innerHTML = "";


if(snapshot.empty){

list.innerHTML =
'<div class="empty">Hakuna comment bado.</div>';

return;

}


snapshot.forEach(
function(commentDoc){

const data =
commentDoc.data();

const div =
document.createElement("div");

div.className =
"comment";

div.innerHTML =
`
<div class="commentUser">
${escapeHtml(data.user || "User")}
</div>

<div class="commentText">
${escapeHtml(data.text || "")}
</div>
`;

list.appendChild(div);

});

}catch(error){

console.error(error);

list.innerHTML =
"❌ Imeshindikana kupakia comments.";

}

}



/* SEND COMMENT */

window.sendComment =
async function(){

if(!currentUser){

return;

}


const input =
document
.getElementById("commentInput");

const text =
input.value.trim();


if(!text){

return;

}


try{

await addDoc(
collection(db,"comments"),
{

videoId:
currentCommentVideo,

user:
currentUser.email,

userName:
currentUser.displayName || "",

text:
text,

createdAt:
Date.now()

}
);


input.value = "";

await loadComments(
currentCommentVideo
);


}catch(error){

console.error(error);

alert(
"❌ Imeshindikana kutuma comment."
);

}

};



/* PROFILE */

window.openMyProfile =
function(){

if(!currentUser){

return;

}

openUserProfile(
currentUser.email,
currentUser.photoURL || ""
);

};



window.openUserProfile =
async function(
userEmail,
photoURL
){

viewedProfileEmail =
userEmail;


document
.getElementById("profileModal")
.style.display =
"block";


document
.getElementById("profileName")
.textContent =
"@" + userEmail;


const photo =
document
.getElementById("profilePhoto");


if(photoURL){

photo.src =
photoURL;

}else{

photo.src =
"https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg";

}


await loadFollowCounts(
userEmail
);

await loadProfileVideos(
userEmail
);


const followButton =
document
.getElementById("followButton");


if(
currentUser &&
currentUser.email === userEmail
){

followButton.style.display =
"none";

}else{

followButton.style.display =
"inline-block";

await updateFollowButton();

}

};



window.closeProfile =
function(){

document
.getElementById("profileModal")
.style.display =
"none";

};



/* FOLLOW ID */

function makeFollowId(
followerUid,
followingEmail
){

return (
followerUid +
"_" +
encodeURIComponent(
followingEmail
)
);

}



/* FOLLOW STATUS */

async function updateFollowButton(){

if(
!currentUser ||
!viewedProfileEmail
){

return;

}


const id =
makeFollowId(
currentUser.uid,
viewedProfileEmail
);


const followDoc =
await getDoc(
doc(db,"follows",id)
);


const button =
document
.getElementById("followButton");


if(followDoc.exists()){

button.textContent =
"Following ✓";

button.classList.add(
"followingButton"
);

}else{

button.textContent =
"Follow";

button.classList.remove(
"followingButton"
);

}

}



/* FOLLOW / UNFOLLOW */

window.toggleFollow =
async function(){

if(
!currentUser ||
!viewedProfileEmail
){

return;

}


if(
currentUser.email ===
viewedProfileEmail
){

return;

}


const id =
makeFollowId(
currentUser.uid,
viewedProfileEmail
);


const followRef =
doc(
db,
"follows",
id
);


try{

const existing =
await getDoc(followRef);


if(existing.exists()){

await deleteDoc(
followRef
);

}else{

await setDoc(
followRef,
{

followerUid:
currentUser.uid,

followerEmail:
currentUser.email,

followingEmail:
viewedProfileEmail,

createdAt:
Date.now()

}
);

}


await updateFollowButton();

await loadFollowCounts(
viewedProfileEmail
);


}catch(error){

console.error(error);

alert(
"❌ Imeshindikana kubadilisha Follow."
);

}

};



/* FOLLOW COUNTS */

async function loadFollowCounts(
userEmail
){

try{

const followersQuery =
query(
collection(db,"follows"),
where(
"followingEmail",
"==",
userEmail
)
);


const followingQuery =
query(
collection(db,"follows"),
where(
"followerEmail",
"==",
userEmail
)
);


const followers =
await getDocs(
followersQuery
);

const following =
await getDocs(
followingQuery
);


document
.getElementById("followersCount")
.textContent =
followers.size;


document
.getElementById("followingCount")
.textContent =
following.size;


}catch(error){

console.error(error);

}

}



/* PROFILE VIDEOS */

async function loadProfileVideos(
userEmail
){

const container =
document
.getElementById("profileVideos");

container.innerHTML = "";

try{

const q =
query(
collection(db,"videos"),
where(
"user",
"==",
userEmail
)
);


const snapshot =
await getDocs(q);


document
.getElementById("profileVideoCount")
.textContent =
snapshot.size;


if(snapshot.empty){

container.innerHTML =
'<div class="empty">Hakuna video.</div>';

return;

}


snapshot.forEach(
function(videoDoc){

const data =
videoDoc.data();

const video =
document.createElement("video");

video.src =
data.videoUrl;

video.controls =
true;

video.playsInline =
true;

container.appendChild(video);

});

}catch(error){

console.error(error);

}

}



/* HTML SECURITY */

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


</script>

</body>
</html>
