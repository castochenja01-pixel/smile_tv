<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smile</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
overflow:hidden;
}

#loginBox{
position:fixed;
inset:0;
background:linear-gradient(135deg,#111,#222);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
z-index:1000;
padding:20px;
}

#loginBox h1{
font-size:38px;
margin:0 0 10px;
}

#loginBox p{
color:#ccc;
font-size:18px;
}

#loginButton{
border:0;
border-radius:30px;
padding:15px 28px;
font-size:17px;
font-weight:bold;
background:#fff;
color:#111;
cursor:pointer;
margin-top:15px;
}

#loginMessage{
color:#ff6b6b;
max-width:350px;
font-size:14px!important;
}

#app{
display:none;
width:100%;
height:100%;
position:relative;
}

.topbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
z-index:50;
background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);
}

.logo{
font-size:22px;
font-weight:bold;
}

.uploadBtn{
border:0;
background:#fff;
color:#000;
padding:9px 14px;
border-radius:20px;
font-weight:bold;
cursor:pointer;
}

#feed{
width:100%;
height:100%;
overflow-y:auto;
scroll-snap-type:y mandatory;
scrollbar-width:none;
}

#feed::-webkit-scrollbar{
display:none;
}

.videoCard{
width:100%;
height:100vh;
position:relative;
scroll-snap-align:start;
background:#000;
}

.videoCard video{
width:100%;
height:100%;
object-fit:cover;
display:block;
background:#000;
}

.info{
position:absolute;
left:15px;
bottom:35px;
right:90px;
z-index:10;
text-shadow:0 1px 5px #000;
}

.username{
font-size:19px;
font-weight:bold;
margin-bottom:8px;
}

.caption{
font-size:15px;
line-height:1.4;
}

.actions{
position:absolute;
right:12px;
bottom:80px;
display:flex;
flex-direction:column;
gap:8px;
z-index:20;
}

.actionBtn{
width:52px;
height:52px;
border-radius:50%;
border:0;
background:rgba(0,0,0,.6);
color:#fff;
font-size:23px;
cursor:pointer;
}

.count{
font-size:12px;
text-align:center;
margin-bottom:5px;
}

.empty{
height:100%;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:30px;
color:#bbb;
}

#loading{
position:fixed;
inset:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:900;
font-size:18px;
}

#commentsPanel{
position:fixed;
left:0;
right:0;
bottom:0;
height:70%;
background:#111;
z-index:300;
display:none;
border-radius:20px 20px 0 0;
padding:15px;
}

#commentsHeader{
display:flex;
justify-content:space-between;
align-items:center;
font-size:18px;
font-weight:bold;
padding-bottom:10px;
border-bottom:1px solid #333;
}

#closeComments{
background:none;
border:0;
color:#fff;
font-size:25px;
}

#commentsList{
height:calc(100% - 120px);
overflow-y:auto;
padding:10px 0;
}

.comment{
padding:10px;
margin-bottom:8px;
background:#222;
border-radius:10px;
}

.commentUser{
font-weight:bold;
font-size:14px;
margin-bottom:4px;
}

.commentText{
font-size:15px;
color:#ddd;
}

#commentInputBox{
position:absolute;
bottom:15px;
left:15px;
right:15px;
display:flex;
gap:8px;
}

#commentInput{
flex:1;
padding:13px;
border:0;
border-radius:25px;
outline:none;
}

#sendComment{
padding:12px 18px;
border:0;
border-radius:25px;
background:#fff;
color:#000;
font-weight:bold;
}

</style>
</head>

<body>

<div id="loginBox">

<h1>😊 Smile</h1>

<p>Karibu Smile</p>

<button id="loginButton">
🔐 Ingia kwa Google
</button>

<p id="loginMessage"></p>

</div>


<div id="app">

<div class="topbar">

<div class="logo">
😊 Smile 
</div>

<button class="uploadBtn" id="uploadButton">
⬆️ Upload
</button>

<button class="uploadBtn" id="profileButton">
👤 Profile
</button>
</div>
<div id="loading">
Inapakia Smile TV...
</div>

<div id="feed"></div>

</div>


<!-- COMMENTS -->

<div id="commentsPanel">

<div id="commentsHeader">

<span>💬 Comments</span>

<button id="closeComments">
✕
</button>

</div>

<div id="commentsList">
Inapakia comments...
</div>

<div id="commentInputBox">

<input
id="commentInput"
type="text"
placeholder="Andika comment..."
>

<button id="sendComment">
Tuma
</button>

</div>

</div>


<script src="https://upload-widget.cloudinary.com/global/all.js"></script>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy,
updateDoc,
doc,
increment
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey: "AIzaSyCu5afNJaHts8CSUGnwJg-TgRZzHBMH0eU",

authDomain: "smile-tv-1d3a1.firebaseapp.com",

projectId: "smile-tv-1d3a1",

storageBucket: "smile-tv-1d3a1.firebasestorage.app",

messagingSenderId: "873816908067",

appId: "1:873816908067:web:01a899081383a74e55ec96"

};


/* =========================
FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();

let currentUser = null;

let currentCommentVideo = null;


/* =========================
LOGIN
========================= */

document.getElementById("loginButton").onclick = async function(){

const message =
document.getElementById("loginMessage");

message.textContent="Inaingia...";

try{

await signInWithPopup(
auth,
provider
);

}catch(error){

console.error(error);

message.textContent=
"❌ Imeshindikana kuingia: "+
error.message;

}

};


/* =========================
USER
========================= */

onAuthStateChanged(
auth,
async function(user){

if(user){

currentUser=user;

document.getElementById("loginBox")
.style.display="none";

document.getElementById("app")
.style.display="block";

await loadVideos();

}else{

document.getElementById("loginBox")
.style.display="flex";

document.getElementById("app")
.style.display="none";

}

});


/* =========================
LOAD VIDEOS
========================= */

async function loadVideos(){

const feed=
document.getElementById("feed");

feed.innerHTML="";

try{

const videoQuery=query(
collection(db,"videos"),
orderBy("createdAt","desc")
);

const snapshot=
await getDocs(videoQuery);

document.getElementById("loading")
.style.display="none";


if(snapshot.empty){

feed.innerHTML=`

<div class="empty">

<div>

<h2>😊 Karibu Smile TV</h2>

<p>Bado hakuna video.</p>

<p>Bonyeza ⬆️ Upload kuweka video yako.</p>

</div>

</div>

`;

return;

}


snapshot.forEach(function(item){

createVideoCard(
item.id,
item.data()
);

});

activateAutoPlay();

}catch(error){

console.error(error);

document.getElementById("loading")
.style.display="none";

feed.innerHTML=`

<div class="empty">

❌ Imeshindikana kupakia video.

</div>

`;

}

}


/* =========================
VIDEO CARD
========================= */

function createVideoCard(id,data){

const feed=
document.getElementById("feed");

const card=
document.createElement("div");

card.className="videoCard";

card.innerHTML=`

<video
src="${data.videoUrl}"
controls
loop
playsinline
preload="metadata">
</video>

<div class="info">

<div class="username">
@${escapeHTML(
data.username ||
getUsername(data.user)
)}
</div>

<div class="caption">
${escapeHTML(
data.caption ||
"Karibu Smile 🎬"
)}
</div>

</div>


<div class="actions">

<button class="actionBtn likeBtn">
❤️
</button>

<div class="count">
${data.likes || 0}
</div>

<button class="actionBtn commentBtn">
💬
</button>

<div class="count">
Comments
</div>

<button class="actionBtn shareBtn">
↗️
</button>

</div>

`;

feed.appendChild(card);


card.querySelector(".likeBtn").onclick=
function(){

likeVideo(id,card);

};


card.querySelector(".commentBtn").onclick=
function(){

openComments(id);

};


card.querySelector(".shareBtn").onclick=
function(){

shareVideo(data.videoUrl);

};

}


/* =========================
LIKE
========================= */

async function likeVideo(videoId,card){

try{

const videoRef=
doc(db,"videos",videoId);

await updateDoc(
videoRef,
{
likes:increment(1)
}
);

const count=
card.querySelector(".count");

count.textContent=
Number(count.textContent || 0)+1;

}catch(error){

console.error(error);

alert(
"❌ Like haikuweza kuhifadhiwa."
);

}

}


/* =========================
OPEN COMMENTS
========================= */

async function openComments(videoId){

currentCommentVideo=videoId;

document.getElementById("commentsPanel")
.style.display="block";

const list=
document.getElementById("commentsList");

list.innerHTML=
"⏳ Inapakia comments...";


try{

const q=query(
collection(db,"comments"),
orderBy("createdAt","asc")
);

const snapshot=
await getDocs(q);

list.innerHTML="";

let found=false;


snapshot.forEach(function(item){

const data=item.data();

if(data.videoId===videoId){

found=true;

const comment=
document.createElement("div");

comment.className="comment";

comment.innerHTML=`

<div class="commentUser">
👤 ${escapeHTML(
data.user || "Mtumiaji"
)}
</div>

<div class="commentText">
${escapeHTML(
data.text || ""
)}
</div>

`;

list.appendChild(comment);

}

});


if(!found){

list.innerHTML=
"<p style='color:#aaa;text-align:center'>Bado hakuna comment.</p>";

}

}catch(error){

console.error(error);

list.innerHTML=
"❌ Imeshindikana kupakia comments.";

}

}


/* =========================
CLOSE COMMENTS
========================= */

document.getElementById("closeComments").onclick=
function(){

document.getElementById("commentsPanel")
.style.display="none";

};


/* =========================
SEND COMMENT
========================= */

document.getElementById("sendComment").onclick=
async function(){

const input=
document.getElementById("commentInput");

const text=
input.value.trim();

if(!text){

return;

}

if(!currentUser){

alert("Tafadhali ingia kwanza.");

return;

}


try{

await addDoc(
collection(db,"comments"),
{

videoId:
currentCommentVideo,

text:
text,

user:
currentUser.email,

username:
currentUser.displayName ||
currentUser.email.split("@")[0],

createdAt:
Date.now()

}
);


input.value="";

await openComments(
currentCommentVideo
);

}catch(error){

console.error(error);

alert(
"❌ Comment haikutumwa."
);

}

};


/* =========================
SHARE
========================= */

async function shareVideo(videoUrl){

try{

if(navigator.share){

await navigator.share({

title:"Smile",

text:
"Angalia video hii kwenye Smile TV 🎬",

url:videoUrl

});

}else{

await navigator.clipboard.writeText(
videoUrl
);

alert(
"✅ Link imenakiliwa."
);

}

}catch(error){

console.log(error);

}

}


/* =========================
UPLOAD
========================= */

document.getElementById("uploadButton").onclick=
function(){

if(!currentUser){

alert(
"Tafadhali ingia kwanza."
);

return;

}


cloudinary.openUploadWidget(

{

cloudName:"hvzksa0n",

uploadPreset:"smile_tv",

sources:[
"local",
"camera"
],

multiple:false,

resourceType:"video"

},

async function(error,result){

if(error){

console.error(error);

alert(
"❌ Upload imeshindikana."
);

return;

}


if(result.event==="success"){

const videoUrl=
result.info.secure_url;


try{

await addDoc(
collection(db,"videos"),
{

videoUrl:videoUrl,

user:currentUser.email,

username:
currentUser.displayName ||
currentUser.email.split("@")[0],

caption:
"Karibu Smile TV 🎬",

likes:0,

createdAt:Date.now()

}
);

alert(
"✅ Video imepakiwa Smile TV!"
);

await loadVideos();

}catch(error){

console.error(error);

alert(
"❌ Video imepakiwa lakini haijahifadhiwa Firebase."
);

}

}

}

);

};

document.getElementById("profileButton").onclick = function(){

if(!currentUser){

alert("Tafadhali ingia kwanza.");

return;

}

alert(
"👤 Profile\n\n" +
"Jina: " +
(currentUser.displayName || "Mtumiaji") +
"\nEmail: " +
currentUser.email
);

};
/* =========================
AUTO PLAY
========================= */

function activateAutoPlay(){

const videos=
document.querySelectorAll(
".videoCard video"
);

const observer=
new IntersectionObserver(

function(entries){

entries.forEach(
function(entry){

const video=
entry.target;

if(entry.isIntersecting){

video.play()
.catch(function(){});

}else{

video.pause();

}

});

},

{
threshold:0.65
}

);


videos.forEach(
function(video){

observer.observe(video);

});

}


/* =========================
HELPERS
========================= */

function getUsername(email){

if(!email){

return "SmileTV";

}

return email.split("@")[0];

}


function escapeHTML(text){

const div=
document.createElement("div");

div.textContent=
text || "";

return div.innerHTML;

}

</script>

</body>
</html>
