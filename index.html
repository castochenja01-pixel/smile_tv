<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smile TV</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}
<!-- SMILE TV UPLOAD -->
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<button id="uploadBtn" style="
position:fixed;
bottom:20px;
left:20px;
z-index:9999;
background:#ff0050;
color:white;
border:none;
padding:14px 22px;
border-radius:30px;
font-size:16px;
font-weight:bold;
">
📤 Upload Video
</button>

<script>
document.getElementById("uploadBtn").addEventListener("click", function () {

  cloudinary.openUploadWidget(
    {
      cloudName: "hvzksa0n",
      uploadPreset: "smile_tv",
      sources: ["local", "camera"],
      multiple: false,
      resourceType: "video"
    },
    function (error, result) {

      if (!error && result && result.event === "success") {

        const videoUrl = result.info.secure_url;

        alert("✅ Video imepakiwa Smile TV!");

        console.log("VIDEO URL:", videoUrl);
      }
    }
  );

});
</script>
body{
    background:#000;
    font-family:Arial,sans-serif;
    color:white;
    overflow:hidden;
}

.app{
    width:100%;
    height:100vh;
    position:relative;
}

.video{
    width:100%;
    height:100vh;
    object-fit:cover;
    background:linear-gradient(135deg,#111,#333);
}

.logo{
    position:absolute;
    top:20px;
    left:18px;
    font-size:25px;
    font-weight:bold;
    z-index:5;
}

.logo span{
    color:#19d66b;
}

.info{
    position:absolute;
    bottom:30px;
    left:15px;
    right:80px;
    z-index:5;
}

.username{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.caption{
    font-size:15px;
    line-height:1.4;
}

.actions{
    position:absolute;
    right:12px;
    bottom:100px;
    display:flex;
    flex-direction:column;
    gap:20px;
    text-align:center;
    z-index:5;
}

.action{
    font-size:28px;
}

.action small{
    display:block;
    font-size:12px;
    margin-top:3px;
}

.bottom{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:rgba(0,0,0,.75);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:10;
}

.bottom div{
    text-align:center;
    font-size:12px;
}

.bottom b{
    display:block;
    font-size:22px;
    margin-bottom:3px;
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">
        😊 Smile<span>TV</span>
    </div>

   <source src="Wanaume.mp4" type="video/mp4">

    <div class="info">
        <div class="username">@SmileCreator</div>

        <div class="caption">
            Karibu Smile TV 🎬
            <br>
            Shiriki video yako na dunia 🌍
        </div>
    </div>

    <div class="actions">

        <div class="action">
            ❤️
            <small>1.2K</small>
        </div>

        <div class="action">
            💬
            <small>125</small>
        </div>

        <div class="action">
            ↗️
            <small>Share</small>
        </div>

        <div class="action">
            👤
            <small>Follow</small>
        </div>

    </div>

    <div class="bottom">

        <div>
            <b>🏠</b>
            Home
        </div>

        <div>
            <b>🔎</b>
            Search
        </div>

        <div>
            <b>➕</b>
            Upload
        </div>

        <div>
            <b>👤</b>
            Profile
        </div>

    </div>

</div>

</body>
</html>
