<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smile TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #loginBox {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #111, #222);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 1000;
      padding: 20px;
    }

    #loginBox h1 {
      font-size: 38px;
      margin: 0 0 10px;
    }

    #loginBox p {
      color: #ccc;
      font-size: 18px;
    }

    #loginButton {
      border: none;
      border-radius: 30px;
      padding: 15px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #fff;
      color: #111;
      margin-top: 15px;
    }

    #loginMessage {
      color: #ff6b6b;
      max-width: 320px;
      font-size: 14px !important;
    }

    #app {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 50;
      background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .uploadBtn {
      border: none;
      background: #fff;
      color: #000;
      padding: 9px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #feed {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    #feed::-webkit-scrollbar {
      display: none;
    }

    .videoCard {
      width: 100%;
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
      background: #000;
    }

    .videoCard video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .info {
      position: absolute;
      left: 15px;
      bottom: 35px;
      right: 90px;
      z-index: 10;
      text-shadow: 0 1px 5px #000;
    }

    .username {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .caption {
      font-size: 15px;
      line-height: 1.4;
    }

    .actions {
      position: absolute;
      right: 12px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 20;
    }

    .actionBtn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 23px;
      cursor: pointer;
    }

    .count {
      font-size: 12px;
      text-align: center;
      margin-top: -13px;
    }

    .empty {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      color: #bbb;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 900;
      font-size: 18px;
    }

    #commentBox {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #181818;
      padding: 15px;
      display: none;
      z-index: 200;
    }

    #commentInput {
      width: 100%;
      padding: 12px;
      border-radius: 22px;
      border: none;
      outline: none;
      margin-bottom: 10px;
    }

    #sendComment {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 22px;
      background: #fff;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginBox">
    <h1>😊 Smile TV</h1>
    <p>Karibu Smile TV</p>

    <button id="loginButton">
      🔐 Ingia kwa Google
    </button>

    <p id="loginMessage"></p>
  </div>

  <!-- APP -->
  <div id="app">

    <div class="topbar">
      <div class="logo">😊 Smile TV</div>

      <button class="uploadBtn" id="uploadButton">
        ⬆️ Upload
      </button>
    </div>

    <div id="loading">
      Inapakia Smile TV...
    </div>

    <div id="feed"></div>

  </div>

  <!-- COMMENT -->
  <div id="commentBox">
    <input
      id="commentInput"
      type="text"
      placeholder="Andika comment..."
    >

    <button id="sendComment">
      Tuma Comment
    </button>
  </div>

  <!-- CLOUDINARY -->
  <script src="https://upload-widget.cloudinary.com/global/all.js"></script>

  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy,
      updateDoc,
      doc,
      increment
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
       ========================= */

    const firebaseConfig = {

      apiKey: "AIzaSyCu5afNJaHts8CSUGnwJg-TgRZzHBMH0eU",

      authDomain: "smile-tv-1d3a1.firebaseapp.com",

      projectId: "smile-tv-1d3a1",

      storageBucket: "smile-tv-1d3a1.firebasestorage.app",

      messagingSenderId: "873816908067",

      appId: "1:873816908067:web:01a899081383a74e55ec96"

    };


    /* =========================
       FIREBASE START
       ========================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const provider = new GoogleAuthProvider();


    let currentUser = null;

    let currentCommentVideo = null;


    /* =========================
       GOOGLE LOGIN
       ========================= */

    document
      .getElementById("loginButton")
      .addEventListener("click", async function () {

        const message =
          document.getElementById("loginMessage");

        message.textContent = "Inaingia...";

        try {

          await signInWithPopup(
            auth,
            provider
          );

        } catch (error) {

          console.error(error);

          message.textContent =
            "❌ Imeshindikana kuingia: " +
            error.message;

        }

      });


    /* =========================
       USER LOGIN CHECK
       ========================= */

    onAuthStateChanged(
      auth,
      async function (user) {

        if (user) {

          currentUser = user;

          document
            .getElementById("loginBox")
            .style.display = "none";

          document
            .getElementById("app")
            .style.display = "block";

          await loadVideos();

        } else {

          document
            .getElementById("loginBox")
            .style.display = "flex";

          document
            .getElementById("app")
            .style.display = "none";

        }

      }
    );


    /* =========================
       LOAD VIDEOS
       ========================= */

    async function loadVideos() {

      const feed =
        document.getElementById("feed");

      feed.innerHTML = "";

      try {

        const videoQuery = query(
          collection(db, "videos"),
          orderBy("createdAt", "desc")
        );

        const snapshot =
          await getDocs(videoQuery);

        document
          .getElementById("loading")
          .style.display = "none";


        if (snapshot.empty) {

          feed.innerHTML = `
            <div class="empty">
              <div>
                <h2>😊 Karibu Smile TV</h2>
                <p>Bado hakuna video.</p>
                <p>Bonyeza ⬆️ Upload kuweka video yako.</p>
              </div>
            </div>
          `;

          return;

        }


        snapshot.forEach(function (item) {

          const data = item.data();

          createVideoCard(
            item.id,
            data
          );

        });


        activateAutoPlay();

      } catch (error) {

        console.error(error);

        document
          .getElementById("loading")
          .style.display = "none";

        feed.innerHTML = `
          <div class="empty">
            ❌ Imeshindikana kupakia video.
          </div>
        `;

      }

    }


    /* =========================
       CREATE VIDEO CARD
       ========================= */

    function createVideoCard(id, data) {

      const feed =
        document.getElementById("feed");


      const card =
        document.createElement("div");

      card.className = "videoCard";

      card.innerHTML = `

        <video
          src="${data.videoUrl}"
          controls
          loop
          playsinline
          preload="metadata">
        </video>

        <div class="info">

          <div class="username">
            @${escapeHTML(
              data.username ||
              getUsername(data.user)
            )}
          </div>

          <div class="caption">
            ${escapeHTML(
              data.caption ||
              "Karibu Smile TV 🎬"
            )}
          </div>

        </div>


        <div class="actions">

          <button
            class="actionBtn likeBtn">
            ❤️
          </button>

          <div class="count">
            ${data.likes || 0}
          </div>


          <button
            class="actionBtn commentBtn">
            💬
          </button>


          <button
            class="actionBtn shareBtn">
            ↗️
          </button>

        </div>

      `;


      feed.appendChild(card);


      const likeButton =
        card.querySelector(".likeBtn");


      const commentButton =
        card.querySelector(".commentBtn");


      const shareButton =
        card.querySelector(".shareBtn");


      likeButton.onclick =
        function () {

          likeVideo(
            id,
            card
          );

        };


      commentButton.onclick =
        function () {

          openComments(id);

        };


      shareButton.onclick =
        function () {

          shareVideo(
            data.videoUrl
          );

        };

    }


    /* =========================
       LIKE
       ========================= */

    async function likeVideo(
      videoId,
      card
    ) {

      try {

        const videoRef =
          doc(
            db,
            "videos",
            videoId
          );


        await updateDoc(
          videoRef,
          {
            likes: increment(1)
          }
        );


        const count =
          card.querySelector(".count");


        count.textContent =
          Number(count.textContent || 0) + 1;


      } catch (error) {

        console.error(error);

      }

    }


    /* =========================
       SHARE
       ========================= */

    async function shareVideo(
      videoUrl
    ) {

      try {

        if (
          navigator.share
        ) {

          await navigator.share({

            title: "Smile TV",

            text:
              "Angalia video hii kwenye Smile TV 🎬",

            url: videoUrl

          });

        } else {

          await navigator.clipboard.writeText(
            videoUrl
          );

          alert(
            "✅ Link ya video imenakiliwa."
          );

        }

      } catch (error) {

        console.log(error);

      }

    }


    /* =========================
       COMMENTS
       ========================= */

    function openComments(
      videoId
    ) {

      currentCommentVideo =
        videoId;

      document
        .getElementById("commentBox")
        .style.display = "block";

      document
        .getElementById("commentInput")
        .focus();

    }


    document
      .getElementById("sendComment")
      .onclick = async function () {

        const input =
          document.getElementById(
            "commentInput"
          );

        const text =
          input.value.trim();


        if (!text) {

          return;

        }


        if (!currentUser) {

          return;

        }


        try {

          await addDoc(
            collection(
              db,
              "comments"
            ),
            {

              videoId:
                currentCommentVideo,

              text:
                text,

              user:
                currentUser.email,

              createdAt:
                Date.now()

            }
          );


          input.value = "";

          document
            .getElementById("commentBox")
            .style.display = "none";


          alert(
            "✅ Comment imetumwa."
          );


        } catch (error) {

          console.error(error);

          alert(
            "❌ Comment haikutumwa."
          );

        }

      };


    /* =========================
       CLOUDINARY UPLOAD
       ========================= */

    document
      .getElementById("uploadButton")
      .onclick = function () {


        if (!currentUser) {

          alert(
            "Tafadhali ingia kwanza."
          );

          return;

        }


        cloudinary.openUploadWidget(

          {

            cloudName:
              "hvzksa0n",

            uploadPreset:
              "smile_tv",

            sources:
              [
                "local",
                "camera"
              ],

            multiple:
              false,

            resourceType:
              "video"

          },


          async function (
            error,
            result
          ) {


            if (error) {

              console.error(
                error
              );

              alert(
                "❌ Upload imeshindikana."
              );

              return;

            }


            if (
              result.event ===
              "success"
            ) {


              const videoUrl =
                result.info.secure_url;


              try {


                await addDoc(

                  collection(
                    db,
                    "videos"
                  ),

                  {

                    videoUrl:
                      videoUrl,

                    user:
                      currentUser.email,

                    username:
                      currentUser.displayName ||
                      currentUser.email
                        .split("@")[0],

                    caption:
                      "Karibu Smile TV 🎬",

                    likes:
                      0,

                    createdAt:
                      Date.now()

                  }

                );


                alert(
                  "✅ Video imepakiwa Smile TV!"
                );


                await loadVideos();


              } catch (error) {

                console.error(
                  error
                );

                alert(
                  "❌ Video imepakiwa lakini haijahifadhiwa Firebase."
                );

              }

            }

          }

        );

      };


    /* =========================
       AUTO PLAY
       ========================= */

    function activateAutoPlay() {

      const videos =
        document.querySelectorAll(
          ".videoCard video"
        );


      const observer =
        new IntersectionObserver(

          function (entries) {

            entries.forEach(
              function (entry) {

                const video =
                  entry.target;


                if (
                  entry.isIntersecting
                ) {

                  video
                    .play()
                    .catch(
                      function () {}
                    );

                } else {

                  video.pause();

                }

              }
            );

          },

          {
            threshold: 0.65
          }

        );


      videos.forEach(
        function (video) {

          observer.observe(
            video
          );

        }
      );

    }


    /* =========================
       HELPERS
       ========================= */

    function getUsername(
      email
    ) {

      if (!email) {

        return "SmileTV";

      }

      return email
        .split("@")[0];

    }


    function escapeHTML(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text || "";

      return div.innerHTML;

    }

  </script>

</body>
</html>
