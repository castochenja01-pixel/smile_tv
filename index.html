<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smile TV</title>

  <script src="https://upload-widget.cloudinary.com/global/all.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      width: 100%;
      position: relative;
    }

    .logo {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 20;
      font-size: 25px;
      font-weight: bold;
    }

    .video-container {
      height: 100vh;
      width: 100%;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111;
    }

    .info {
      position: absolute;
      bottom: 35px;
      left: 15px;
      right: 80px;
      z-index: 10;
      text-shadow: 0 1px 4px #000;
    }

    .username {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .caption {
      font-size: 15px;
    }

    .buttons {
      position: absolute;
      right: 12px;
      bottom: 100px;
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .action {
      border: none;
      background: rgba(0,0,0,.45);
      color: white;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      font-size: 23px;
      cursor: pointer;
    }

    .upload {
      position: fixed;
      right: 15px;
      top: 18px;
      z-index: 30;
      border: none;
      background: #ff0050;
      color: white;
      padding: 12px 17px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #aaa;
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">😊 Smile</div>

  <button class="upload" onclick="uploadVideo()">
    ⬆️ Upload
  </button>

  <div class="video-container">

    <video id="mainVideo" controls autoplay loop playsinline muted>
      <source src="" type="video/mp4">
    </video>

    <div class="info">
      <div class="username">@SmileTV</div>
      <div class="caption">Karibu Smile TV 🎬</div>
    </div>

    <div class="buttons">
      <button class="action" onclick="likeVideo()">❤️</button>
      <button class="action" onclick="commentVideo()">💬</button>
      <button class="action" onclick="shareVideo()">↗️</button>
    </div>

    <div class="empty" id="emptyMessage">
      <h2>Smile TV</h2>
      <p>Pakia video yako kuanza.</p>
    </div>

  </div>

</div>

<script>

let likes = 0;

function uploadVideo() {

  cloudinary.openUploadWidget(
    {
      cloudName: "hvzksa0n",
      uploadPreset: "smile_tv",
      sources: ["local", "camera"],
      multiple: false,
      resourceType: "video"
    },

    function(error, result) {

      if (!error && result && result.event === "success") {

        const videoUrl = result.info.secure_url;

        const video = document.getElementById("mainVideo");

        video.src = videoUrl;
        video.muted = false;

        video.play();

        document.getElementById("emptyMessage").style.display = "none";

        alert("✅ Video imepakiwa Smile TV!");

        console.log("Video URL:", videoUrl);
      }

    }
  );
}


function likeVideo() {

  likes++;

  alert("❤️ Like " + likes);

}


function commentVideo() {

  const comment = prompt("Andika comment yako:");

  if (comment) {
    alert("💬 Comment: " + comment);
  }

}


function shareVideo() {

  const url = document.getElementById("mainVideo").src;

  if (navigator.share) {

    navigator.share({
      title: "Smile TV",
      text: "Tazama video hii kwenye Smile TV",
      url: url
    });

  } else {

    navigator.clipboard.writeText(url);

    alert("🔗 Link ya video imenakiliwa.");

  }

}

</script>

</body>
</html>
