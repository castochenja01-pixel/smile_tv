<!DOCTYPE html>
<html>
<head>
<title>Smile TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="background:black;color:white;text-align:center;font-family:Arial">

<h1>😊 Smile TV</h1>
<p id="msg">Karibu Smile TV</p>

<button onclick="login()" style="
padding:15px 25px;
border-radius:25px;
border:0;
font-size:16px;
">
🔐 Ingia kwa Google
</button>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


// WEKA CONFIG YAKO HAPA

const firebaseConfig = {

apiKey:"WEKA_API_KEY",

authDomain:"WEKA_AUTH_DOMAIN",

projectId:"WEKA_PROJECT_ID",

storageBucket:"WEKA_STORAGE_BUCKET",

messagingSenderId:"WEKA_MESSAGING_ID",

appId:"WEKA_APP_ID"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();



window.login = async function(){

let msg=document.getElementById("msg");

msg.innerHTML="Inaingia...";


try{

await signInWithPopup(auth,provider);

msg.innerHTML="✅ Umeingia Smile TV";


}

catch(error){

msg.innerHTML="❌ "+error.message;

console.log(error);

}


};


</script>

</body>
</html>
